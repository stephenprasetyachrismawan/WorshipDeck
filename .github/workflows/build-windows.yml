name: Build Windows

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Buat GitHub Release dari build ini (tag v<versi package.json>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Tes
        run: npm test

      - name: Bangun installer & versi portable
        run: npx electron-builder --win --x64 --publish never

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: WorshipDeck-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Baca versi
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rilis (tag v* atau jalankan manual dengan opsi release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: WorshipDeck ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*.exe
